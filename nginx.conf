worker_processes 1;
error_log /dev/stdout info;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;

    # 🛡️ ANTI-DDoS & RATE LIMITING CONFIGURATIONS
    limit_req_zone $binary_remote_addr zone=anti_ddos_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    limit_conn addr_limit 50;
    server_tokens off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    grpc_connect_timeout 10s;
    grpc_send_timeout 3600s;
    grpc_read_timeout 3600s;

    server {
        listen 8080 http2;
        server_name _;

        # 🛡️ Apply Anti-DDoS Rate Limiting
        limit_req zone=anti_ddos_limit burst=50 nodelay;

        # Block malicious scanners and user agents
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|openvas|dirbuster)) {
            return 403;
        }

        # Allow only safe methods
        if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$ ) {
            return 405;
        }

        # ==========================================
        # 🔵 VIRGOZKI SSH OVER WEBSOCKET ENDPOINT
        # ==========================================
        location /virgozki-ssh {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ==========================================
        # 🟢 XRAY PROTOCOLS (WS, HU, XHTTP, gRPC)
        # ==========================================
        location /virgozki { 
            proxy_pass http://127.0.0.1:10000; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /virgozki-hu { 
            proxy_pass http://127.0.0.1:10001; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10002; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /vmess-virgozki { 
            proxy_pass http://127.0.0.1:10003; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vmess-virgozki-hu { 
            proxy_pass http://127.0.0.1:10004; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vmess-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10005; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /vless-virgozki { 
            proxy_pass http://127.0.0.1:10006; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vless-virgozki-hu { 
            proxy_pass http://127.0.0.1:10007; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /vless-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10008; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ss-virgozki { 
            proxy_pass http://127.0.0.1:10009; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /ss-virgozki-hu { 
            proxy_pass http://127.0.0.1:10010; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
        location /ss-virgozki-xhttp { 
            proxy_pass http://127.0.0.1:10011; 
            proxy_http_version 1.1; 
            proxy_set_header Host $host; 
            proxy_set_header Connection ""; 
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/vless-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10012;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }
        location ~ ^/vmess-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10013;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }
        location ~ ^/trojan-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10014;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }
        location ~ ^/ss-grpc-virgozki/ {
            if ($content_type !~ "application/grpc") { return 404; }
            client_max_body_size 0;
            grpc_pass grpc://127.0.0.1:10015;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
        }

        location / { 
            root /usr/local/openresty/nginx/html; 
            index index.html; 
        }
    }
}
